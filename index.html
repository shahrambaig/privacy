<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies</title>
<meta name="description" content="Privacy policies for games by Shahram Baig.">
<style>
  :root { --bg: #FBF7EA; --text: #2B1D06; --muted: #6B5D45; --accent: #1F8A55; --rule: #E6DDC4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140D; --text: #F3ECD8; --muted: #B8AD94; --accent: #58CD8D; --rule: #3A3324; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--rule); }
  li:last-child { border-bottom: 1px solid var(--rule); }
  a { display: block; padding: 14px 0; color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Privacy Policies</h1>
  <p>Choose a game to read its privacy policy.</p>
  <ul>
    <li><a href="quackline/">Quackline</a></li>
    <li><a href="blockmerge/">BlockMerge</a></li>
    <!-- Add new games here, e.g. <li><a href="next-game/">Next Game</a></li> -->
  </ul>
</main>
</body>
</html>
